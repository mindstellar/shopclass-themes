name: Theme submission question
description: Ask about registering or hosting a theme here, before opening a PR.
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        Registrations are open by pull request — see CONTRIBUTING.md for the two hosting paths,
        you don't need to ask first. Use this form only if you have a question before (or
        instead of) opening one; it is not a submission itself.
  - type: input
    id: theme-name
    attributes:
      label: Theme name
    validations:
      required: true
  - type: dropdown
    id: hosting
    attributes:
      label: Hosting model
      description: External registration (your own repo) or in-repo hosting?
      options:
        - External — I have my own repository
        - In-repo — I don't have a home for it
    validations:
      required: true
  - type: input
    id: repo-url
    attributes:
      label: Repository URL
      description: If externally hosted, link it. Leave blank otherwise.
    validations:
      required: false
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
